name: publish

# Step 6 (doc/spec.md, chapter 7 / section 4.4.2): publishes a dorgann-
# built package to gh-pages as a Cygwin-compatible binary repository
# (setup.ini format, doc/spec.md chapter 3), for distribution via
# `setup-x86_64.exe --site <Pages URL>`. Originally named publish-
# devel.yml, back when only devel (unofficial/overlay) packages were
# meant to go through here -- renamed once that stopped being true (this
# now publishes ordinary packages too), along with the repository_dispatch
# event type below (yacp's distribute.yml sends `publish`, not
# `publish-devel`, accordingly). The DECISION of whether to publish a
# given build is made by a human (that's what running this workflow
# *is*), but the mechanical work from there -- fetch the artifact, lay it
# out in the release-area convention, regenerate setup.ini via calm, and
# commit/force-push gh-pages -- is fully automated.
#
# Runs on ubuntu-latest, not windows-latest: none of this needs Cygwin --
# calm/mksetupini is plain Python, and the gh-pages update is plain git.
#
# Independent of yacp's PR state (doc/spec.md 4.4): this only looks at
# dorgann's own Actions artifacts, so it works whether or not the
# corresponding yacp PR has been merged, is still open, or exists at all.
#
# Two ways in: workflow_dispatch (manual, `inputs.artifact_id`) and
# repository_dispatch (automatic -- yacp's own distribute.yml sends a
# "publish" event with `client_payload.artifact_id` when it sees one of
# dorgann's PRs get merged, extracting the artifact_id from that PR's own
# dorgann-meta comment, doc/spec.md 4.4.1). Auto-publish-on-merge revises
# the original "publish is a separate human decision, independent of
# merge state" design (doc/spec.md 4.4) -- accepted deliberately, not an
# oversight.
#
# FUTURE: exclude packages whose LICENSE doesn't permit binary
# redistribution before publishing (not implemented yet).

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "ID of the dist artifact to publish (from the Actions run's Artifacts section download-link URL)"
        required: true
        type: string
  repository_dispatch:
    types: [publish]

permissions:
  contents: write

# Every run of this workflow -- whatever package/artifact it's publishing
# -- reads, reshapes, and force-pushes the *same* gh-pages branch as one
# whole tree (doc/spec.md 3.3), so two runs overlapping at all is
# unsafe regardless of whether they touch the same package: confirmed by
# a real race (two runs for different packages, last and libucl,
# triggered close together) where the later run's Checkout gh-pages
# cloned before the earlier run's Commit and force-push had landed, so
# its own force-push then silently reverted the earlier run's changes.
# A single fixed group name (not parameterized by artifact_id/package)
# serializes ALL runs against each other; no cancel-in-progress, since
# the fix here is "wait your turn", not "cancel and lose that publish".
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dorgann
        uses: actions/checkout@v7

      - name: Download dist artifact
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow_dispatch populates inputs.artifact_id;
          # repository_dispatch leaves it empty and populates
          # client_payload.artifact_id instead -- exactly one of the two
          # is ever set, depending on which trigger fired this run.
          ARTIFACT_ID: ${{ inputs.artifact_id || github.event.client_payload.artifact_id }}
        run: bash -- scripts/download_dist_artifact.sh --repo ${{ github.repository }} --artifact-id "$ARTIFACT_ID" --dest artifact

      # gh-pages is checked out (or bootstrapped, on the very first
      # publish) into its own directory rather than as this job's
      # primary checkout, since it gets entirely rebuilt as a single
      # orphan commit below (doc/spec.md 3.3) -- there's no reason to
      # disturb the primary checkout's branch/history for that.
      - name: Checkout gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -- scripts/checkout_gh_pages.sh --repo ${{ github.repository }} --dir gh-pages

      # Custom domain for `setup-x86_64.exe --site`: dist.yacp.dev
      # (DNS: a CNAME record for dist.yacp.dev pointing at
      # yacp-dev.github.io, set up outside this repo). See
      # ensure_gh_pages_cname.sh's own header for why this needs to run
      # every publish rather than being a one-time setup step.
      - name: Configure custom domain (CNAME)
        run: bash -- scripts/ensure_gh_pages_cname.sh --dir gh-pages --domain dist.yacp.dev

      # --exclude-debuginfo: debuginfo tarballs can exceed GitHub's 100 MB
      # per-file push limit (see layout_release_area.sh), so they're left
      # out of dist for now.
      - name: Lay out release area
        id: layout
        run: bash -- scripts/layout_release_area.sh --artifact-dir artifact --gh-pages-dir gh-pages --exclude-debuginfo

      # Pinned to 3.14 rather than '3.x': 3.x resolved to 3.15, for which
      # zstandard (a calm dependency) has no wheel yet, so pip compiled it
      # from source -- about 70 of Install calm's 89 seconds. Move this
      # forward once zstandard ships wheels for the newer Python.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # mksetupini is calm's own console_scripts entry point (setup.cfg),
      # so this puts a `mksetupini` command directly on PATH -- no need
      # for calm's own PYTHONPATH-based invocation wrapper (calm.sh).
      - name: Install calm
        run: pip install git+https://github.com/cygwin/calm.git

      - name: Generate setup.ini
        run: bash -- scripts/generate_setup_ini.sh --gh-pages-dir gh-pages

      # gh-pages is rebuilt to a single commit on every run (3.3), so this
      # message never has history to be read alongside -- just the
      # published package name(s), as a cheap way to eyeball what the
      # current tree actually is without digging into files. The run_id
      # dropped: once past the 90-day Actions log retention it's a dead
      # link, and a commit that's replaced on every run isn't a place
      # worth keeping a for-now-only reference anyway.
      - name: Commit and force-push gh-pages
        run: bash -- scripts/publish_gh_pages.sh --dir gh-pages --message "Publish ${{ steps.layout.outputs.published_packages }}"

      # Pages is deployed from this workflow (build_type: workflow), not
      # by Pages' own branch-triggered build: that build re-cloned the
      # whole gh-pages tree (~3 minutes) and ran Jekyll for nothing. The
      # gh-pages branch is still pushed above -- it is the persistent
      # state the next run's Checkout gh-pages reads -- but pushing it no
      # longer publishes anything by itself. upload-pages-artifact skips
      # dotfiles, so gh-pages/.git stays out of the artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Default is 10 minutes, but Pages' syncing_files phase for
          # this ~1.8GB site sometimes takes longer: a 10-minute
          # timeout aborted (and canceled) a deploy that was still
          # progressing normally.
          timeout: 1800000
