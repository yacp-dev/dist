name: unpublish

# Removes a source package from gh-pages and regenerates setup.ini
# (doc/spec.md 4.4.3). scripts/remove_package.sh is the way in: it checks
# ports as well, dispatches this, waits for dist to stop listing the
# package, and only then removes the recipe from ports.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Source package to remove from gh-pages (its directory under x86_64/release)"
        required: true
        type: string

permissions:
  contents: write

# The same group as publish.yml: each of them reads, reshapes and force-
# pushes the whole gh-pages tree, so overlapping with a publish would
# silently undo one of the two. Concurrency groups are per repository, not
# per workflow.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dorgann
        uses: actions/checkout@v7

      - name: Checkout gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -- scripts/checkout_gh_pages.sh --repo ${{ github.repository }} --dir gh-pages

      - name: Configure custom domain (CNAME)
        run: bash -- scripts/ensure_gh_pages_cname.sh --dir gh-pages --domain dist.yacp.dev

      - name: Remove package
        env:
          PACKAGE: ${{ inputs.package }}
        run: bash -- scripts/unpublish_package.sh --gh-pages-dir gh-pages --package "$PACKAGE"

      # Pinned to 3.14 rather than '3.x', same as publish.yml: 3.x
      # resolved to 3.15, where zstandard has no wheel and pip compiled
      # it from source (about 70 seconds).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install calm
        run: pip install git+https://github.com/cygwin/calm.git

      - name: Generate setup.ini
        run: bash -- scripts/generate_setup_ini.sh --gh-pages-dir gh-pages

      - name: Commit and force-push gh-pages
        env:
          PACKAGE: ${{ inputs.package }}
        run: bash -- scripts/publish_gh_pages.sh --dir gh-pages --message "Remove $PACKAGE"

      # See publish.yml: Pages is deployed from the workflow, so pushing
      # gh-pages alone would leave the removed package on the live site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages

  deploy:
    needs: unpublish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
