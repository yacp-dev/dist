name: build-package

# The run list shows this title, so each package's runs can be told apart.
run-name: build-package ${{ inputs.target }}

# Step 1 (doc/spec.md, chapter 7): validates that a cygport build
# actually works on a windows-latest Actions runner.
# Step 2: adds PR creation against yacp (doc/spec.md 4.4.1). `target`
# is still a manual workflow_dispatch input -- that's Step 3.
# On failure, pushes the bump as a draft PR (doc/spec.md 4.5-4.6) and
# puts the diagnostics in the run summary; no Issue is filed.
# A gate job refuses version updates for packages with an open
# update-blocked Issue (doc/spec.md 4.7) before anything is built.
#
# xezat handles fetching/preparing sources (`xezat prep`, before the
# build), regenerating the package's README/changelog (`xezat bump`,
# after it), and copying the build's results (cygport file, README,
# src.patch) back into the package directory (`xezat port`, after that).
# `xezat prep` copies the package directory's README into the build tree,
# which is what `xezat bump` later reads and appends a changelog entry to
# -- that copy step is why xezat prep is used here instead of a plain
# `cygport ... download`/`prep` (which would leave xezat bump editing a
# stale/absent README). `xezat bump` only ever writes back to that same
# build-tree copy, never to the package directory -- `xezat port` is what
# copies it (and the cygport file itself, and any src.patch) back out;
# without it, the package directory's tracked README would never actually
# change. Using xezat at
# all was originally deferred as an unverified Windows-Ruby risk (xezat
# then depended on github-linguist, which pulls in native-extension gems:
# rugged and charlock_holmes), but now runs against a real Cygwin
# ruby/gem (installed below) rather than the windows-latest runner's
# preinstalled native Windows Ruby -- xezat itself only works
# under genuine Cygwin anyway, since it sources the real /usr/bin/cygport
# as a bash script.
#
# xezat itself is installed from the HEAD of its own GitHub repository
# (scripts/xezat_install.sh) rather than a pinned RubyGems.org release, so
# unreleased fixes are always picked up.
#
# Build dependencies are determined in two passes, mirroring how Cygwin's
# own official CI (cygwin/scallywag) does it: a fixed base toolchain is
# always installed first, then scripts/cygport_depends.sh asks cygport
# itself (via `cygport <file> vars ...`) what extra packages the specific
# cygport file needs. cygwin_packages remains available as a manual
# fallback for whatever the auto-detection doesn't cover. The base
# toolchain's tarballs are cached across runs
# (scripts/cygwin_package_cache.sh); the extra dependencies are not.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build, decided by its shape (scripts/resolve_target.sh): <pkg>-<ver> updates to <ver>, or bumps only the release (1bl1 -> 1bl2) if <ver> is yacp's current one; <pkg>-<ver>-<rel> builds yacp's current release as is for publishing (no PR), or with the next release does a gcc rebuild. An existing dorgann/<pkg>-<ver> branch is rebuilt instead (doc/spec.md 4.6), and a version update has to come with its branch, which port-until-green's preflight pushes; that is also how a package not in yacp yet is built, from the draft recipe pushed there (4.8)."
        required: true
        type: string
      cygwin_packages:
        description: "Extra Cygwin packages to install on top of auto-detected ones (space-separated, e.g. pkg-devel)"
        required: false
        type: string
        default: ""
      check_timeout_minutes:
        description: "Timeout (minutes) for cygport check -- failures/timeouts there don't block the PR"
        required: false
        type: number
        default: 10
      changelog_message:
        description: "Changelog message for xezat bump (its -m), overriding the automatically decided one (\"Version bump.\"/\"Rebuild with gcc-<ver>\"/\"Rebuild\"). Ignored for <pkg>-<ver>-<rel> of the current release."
        required: false
        type: string
        default: ""

# issues:read for check_update_blocked.sh (doc/spec.md 4.7).
permissions:
  contents: read
  issues: read

jobs:
  # Resolves `target` into a mode, package and version
  # (scripts/resolve_target.sh), and refuses the update up front while an
  # open `update-blocked` Issue names the package (doc/spec.md 4.7) -- a
  # separate ubuntu-latest job rather than a first step of build, since a
  # job can't end early with success from inside a step, and skipping
  # build as a whole saves guarding each of its steps. A target that
  # doesn't resolve fails here, before a Windows runner is spent on it.
  # Only version updates (`bump`) are refused for a blocker: the other
  # modes build the version already in yacp, which the blocker doesn't
  # affect, or (`new`) a package not in yacp yet, which nothing blocks.
  # `new` needs nothing of its own below: its dorgann/<pkg>-<ver> branch
  # makes it a branch rebuild like any other (doc/spec.md 4.8).
  gate:
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
      mode: ${{ steps.target.outputs.mode }}
      package: ${{ steps.target.outputs.package }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Checkout dorgann
        uses: actions/checkout@v7

      # `latest` (a bare package name) is refused rather than resolved
      # here: picking the newest upstream version takes judgment (distro
      # forks, prereleases, Repology project names) that the
      # port-until-green skill makes before dispatching with a version.
      - name: Resolve target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          if ! bash -- scripts/resolve_target.sh --repo yacp-dev/ports --target "$TARGET"; then
            message="$(sed -n 's/^message=//p' "$GITHUB_OUTPUT")"
            [[ -n "$message" ]] || message="Couldn't resolve '$TARGET'"
            echo "::error::$message"
            exit 1
          fi
          if grep -qx 'mode=latest' "$GITHUB_OUTPUT"; then
            echo "::error::No version in '$TARGET' -- give <pkg>-<ver> (or <pkg>-<ver>-<rel>)"
            exit 1
          fi

      - name: Check for update-blocked Issue
        id: check
        if: steps.target.outputs.mode == 'bump'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -- scripts/check_update_blocked.sh --repo "${{ github.repository }}" --package "${{ steps.target.outputs.package }}"

  build:
    needs: gate
    if: needs.gate.outputs.blocked != 'true'
    runs-on: windows-latest
    steps:
      # windows-latest runners default to core.autocrlf=true, which
      # rewrites LF to CRLF on checkout and breaks bash reading any script
      # file directly ("$'\r': command not found") -- including yacp's own
      # .cygport files, which cygport itself sources as a bash script.
      # dorgann's own files are additionally covered by .gitattributes,
      # but that only applies within this repo, not the yacp-dev/ports checkout
      # below, so this has to be set globally before either checkout runs.
      - name: Disable line-ending conversion on checkout
        run: git config --global core.autocrlf false

      - name: Checkout dorgann
        uses: actions/checkout@v7

      # dorgann's own default GITHUB_TOKEN is scoped to dorgann only and
      # can't push to yacp, so everything touching yacp-dev/ports below
      # uses a GitHub App installation token instead (doc/spec.md 4.4.1)
      # -- an App rather than a PAT so the branches/PRs it creates are
      # attributed to the App's own bot account, not to whoever owns the
      # token. The App needs Contents: Read and write and Pull requests:
      # Read and write on yacp-dev/ports.
      - name: Generate yacp token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DORGANN_APP_ID }}
          private-key: ${{ secrets.DORGANN_APP_PRIVATE_KEY }}
          owner: yacp-dev
          repositories: ports

      # create-pull-request's `author` defaults to github.actor (whoever
      # ran workflow_dispatch), so without overriding it the commits
      # would still count toward that person's contributions even though
      # the PR itself is the bot's. The bot's noreply address needs its
      # numeric user id, which the token step doesn't output directly.
      # shell: bash explicitly, since windows-latest defaults to pwsh.
      - name: Resolve bot identity
        id: bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "identity=${APP_SLUG}[bot] <${id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Checkout yacp
        uses: actions/checkout@v7
        with:
          repository: yacp-dev/ports
          path: yacp
          # Always yacp-dev/ports's own default branch, even in branch-rebuild
          # mode (doc/spec.md 4.6) -- checking out the branch here
          # directly was tried first and broke peter-evans/create-pull-
          # request's own base-branch reconciliation (confirmed by a real
          # run: with nothing newly committed during a run that only
          # re-validates an already-fixed branch, it collapsed the whole
          # branch down to be byte-identical to base and deleted/closed it
          # outright). Overlay branch content below brings the branch's
          # fix in as a plain uncommitted diff against this checkout
          # instead, which doesn't have that problem.
          #
          # The App token (see Generate yacp token above) is needed on
          # checkout too, not just on the Create Pull Request step below,
          # since that's what determines which credentials `git push`
          # inside this checkout uses.
          token: ${{ steps.app-token.outputs.token }}

      # Brings back the base toolchain's tarballs from the newest earlier
      # run, so setup.exe only downloads what changed since. See
      # scripts/cygwin_package_cache.sh for why, and for how the cache is
      # kept from growing. The key itself never matches; restore-keys
      # picks the most recently saved cache.
      - name: Restore Cygwin package cache
        id: package-cache
        uses: actions/cache/restore@v6
        with:
          path: D:\cygwin-packages
          key: cygwin-base
          restore-keys: cygwin-base-

      - name: Install Cygwin (base toolchain)
        id: cygwin-base
        uses: cygwin/cygwin-install-action@v6
        with:
          # Pinned to what the action picks anyway on windows-latest, so
          # its package directory is the D:\cygwin-packages cached above.
          work-vol: "D:"
          # cygport itself already depends on autoconf/automake/libtool/
          # make/binutils etc., but not on a compiler -- see doc/spec.md
          # and scripts/cygport_depends.sh for why gcc isn't detected
          # per-package. python3/ruby/rubygems aren't for building the
          # package itself either: cygport's own packaging phase
          # (pkg_info.cygpart) unconditionally probes for ruby+gem to
          # generate runtime dependency metadata, and separately scans
          # installed files for a python3 shebang to do the same -- e.g.
          # yacp/last ships C++ binaries alongside python3-shebang helper
          # scripts. Without a real Cygwin ruby/gem here, that probe was
          # instead finding the windows-latest runner's preinstalled
          # native Windows Ruby, whose RubyGems API cygport's script
          # doesn't expect (NoMethodError on Gem.default_dirs).
          packages: cygport util-linux sed gcc-core gcc-g++ python3 ruby rubygems
          # Setting `site` at all replaces this action's own default
          # (confirmed empty in action.yml itself -- the actual mirror
          # fallback is hardcoded in the action's own implementation, not
          # a declared input default), so the real mirror has to be
          # spelled out here alongside dorgann's own gh-pages (chapter 3)
          # -- otherwise this would only ever be able to see packages
          # dorgann itself has published, losing the rest of Cygwin
          # entirely. Lets a build depend on another package that's only
          # ever been published here, not (yet, or at all) in the
          # official archive.
          #
          # The custom domain publish.yml configures (dist.yacp.dev), not
          # the plain <owner>.github.io one (doc/spec.md 3.1's custom-
          # domain caveat) -- needs updating if that domain ever changes.
          site: "http://mirrors.kernel.org/sourceware/cygwin/ https://dist.yacp.dev/"
          # publish.yml's own release area (3.2) never generates .sig
          # files -- that's calm's own maintainer-upload signing step on
          # the real Cygwin infrastructure, not something in use here --
          # so check-sig's default (true) would reject every package
          # dorgann's own gh-pages site actually serves.
          check-sig: false

      # Only a cache, so neither step may fail the build.
      - name: Trim Cygwin package cache
        id: package-cache-key
        continue-on-error: true
        run: bash -- scripts/cygwin_package_cache.sh '${{ steps.cygwin-base.outputs.package-cache }}'

      - name: Save Cygwin package cache
        if: steps.package-cache-key.outputs.key != '' && steps.package-cache-key.outputs.key != steps.package-cache.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: D:\cygwin-packages
          key: ${{ steps.package-cache-key.outputs.key }}

      # Once Cygwin is installed, its own git ends up ahead of Git for
      # Windows on PATH for the rest of the job -- including in steps
      # that don't explicitly say `bash --` (e.g. Show diff below), since
      # PATH is a job-wide env var, not something bash-specific. Cygwin's
      # git then refuses to touch the yacp checkout at all ("detected
      # dubious ownership in repository at '/cygdrive/...'", confirmed by
      # a real run) -- actions/checkout (a native Windows/Node action)
      # and Cygwin's own git disagree about whose file-ownership check
      # the directory should satisfy. `--global` writes to `$HOME/
      # .gitconfig`, and bash-invoked vs. plain steps have historically
      # disagreed about what $HOME even is on this runner (see Configure
      # cygport below) -- so this is set both ways rather than trusting
      # either alone to cover every later step that touches yacp.
      #
      # core.autocrlf false is set alongside it for the same reason:
      # "Disable line-ending conversion on checkout" above only configures
      # whichever git that plain (non-bash) step resolves to, which at
      # that point in the job (before Cygwin's installed) is Git for
      # Windows -- never Cygwin's own git, which is what `cygport fetch`
      # actually shells out to (via xezat prep, itself a `bash --` step)
      # for every upstream source clone from here on. Left at whatever
      # Cygwin's git defaults to, a patch generated against a plain LF
      # checkout can fail to apply against a CRLF-converted one at every
      # -p level cygport tries, with no more detail than "will not apply"
      # (confirmed against a real run -- htslib's src.patch, verified
      # byte-for-byte correct against the actual upstream Makefile, still
      # wouldn't apply in CI while applying fine locally).
      - name: Configure git safe.directory (Cygwin)
        run: bash -c "git config --global --add safe.directory '*' && git config --global core.autocrlf false"

      - name: Configure git safe.directory (Windows)
        run: git config --global --add safe.directory '*'

      # Must run after Cygwin is installed (and installed early, before
      # anything that could invoke `cygport fetch`, i.e. `xezat prep`
      # below): a bare `bash` on windows-latest resolves to Git for
      # Windows' bash until cygwin-install-action puts Cygwin's own bash
      # ahead of it on PATH, and the two have different $HOME values --
      # writing this config under the wrong one would make cygport never
      # see it.
      - name: Configure cygport
        run: bash -- scripts/configure_cygport.sh

      # Auto-detects branch-rebuild mode (doc/spec.md 4.6): if
      # dorgann/<package>-<version> already exists in yacp (typically left
      # over from an earlier failed run's own draft PR, or pushed by hand,
      # e.g. a git-snapshot bump), rebuild that branch instead of bumping
      # again -- re-dispatching the same target is how a pushed fix gets
      # built. Covers rebuild/gcc-rebuild too: their branch is named after
      # the unchanged version, so a failed release bump is re-run the
      # same way. Not deploy, which builds master as is. A pure API call,
      # so it doesn't need yacp checked out locally first.
      - name: Detect existing branch (auto branch-rebuild)
        id: auto-branch
        if: needs.gate.outputs.mode != 'deploy'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash -- scripts/detect_existing_branch.sh --repo yacp-dev/ports --package "${{ needs.gate.outputs.package }}" --version "${{ needs.gate.outputs.version }}"

      # Branch-rebuild mode (doc/spec.md 4.6): brings the target branch's
      # version of the package directory in as a plain uncommitted diff
      # against the master checkout above, rather than checking out the
      # branch itself (see Checkout yacp for why that broke). Must run
      # before Detect existing cygport below, which reads this directory.
      - name: Overlay branch content (branch-rebuild mode)
        if: steps.auto-branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash -- scripts/overlay_branch_package.sh --dir yacp --repo yacp-dev/ports --base master --branch "${{ steps.auto-branch.outputs.branch }}"

      # Two mutually exclusive paths: a branch rebuild (auto-detected above,
      # doc/spec.md 4.6), or a same-version release rebuild (`rebuild`/
      # `gcc-rebuild`, no branch involved), plus a validate-only build of
      # whatever's already committed (`deploy`, for validating/publishing
      # an already-merged fix dorgann never actually built). A version bump
      # (`bump`) has no step of its own: its bump is made by port-until-green's
      # preflight (Step 1b) on dorgann/<pkg>-<ver>, which must already be
      # pushed, so it's refused here when that branch is missing.
      # Every step below reads steps.detect.outputs, which Detect existing
      # cygport sets on all paths that get this far.
      - name: Require existing branch for version bump
        if: steps.auto-branch.outputs.branch == '' && needs.gate.outputs.mode == 'bump'
        run: |
          echo "::error::No dorgann/${{ needs.gate.outputs.package }}-${{ needs.gate.outputs.version }} branch. Start the update with port-until-green so its preflight creates and pushes the branch."
          exit 1

      # Same-version rebuild (no branch involved): bumps only the release
      # number (1bl1 -> 1bl2), for picking up a newer toolchain with no
      # source changes -- unlike a version bump, which refuses to touch a
      # package already at the requested version. An existing
      # branch always wins: it already carries the bumped release.
      - name: Bump release (rebuild mode)
        if: steps.auto-branch.outputs.branch == '' && (needs.gate.outputs.mode == 'rebuild' || needs.gate.outputs.mode == 'gcc-rebuild')
        run: bash -- scripts/bump_release.sh --dir "yacp/${{ needs.gate.outputs.package }}"

      - name: Detect existing cygport (branch/release-rebuild mode)
        id: detect
        run: bash -- scripts/detect_cygport_file.sh --dir "yacp/${{ needs.gate.outputs.package }}"

      # yacp writes BUILD_REQUIRES one package per tab-indented line;
      # rewrites a single-line or otherwise-indented list into that form
      # so the PR carries it along with the bump. A no-op on a file
      # already in that form. Skipped for deploy, which has no PR
      # to carry the change.
      - name: Format BUILD_REQUIRES
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        run: bash -- scripts/format_build_requires.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      - name: Determine extra build dependencies
        id: depends
        run: bash -- scripts/cygport_depends.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      - name: Install Cygwin (extra dependencies)
        uses: cygwin/cygwin-install-action@v6
        with:
          # Nothing here is for `gem install xezat` below: xezat no longer
          # depends on github-linguist, so none of its gems has a native
          # extension to compile. Installing libgit2-devel for that used to
          # hide a missing libssl-devel in a package's BUILD_REQUIRES.
          # python312-setuptools is for `cygport dep` (run by `xezat
          # bump`): it reads a Python script's version via
          # `from distutils.sysconfig import ...`, and distutils is gone
          # from Python 3.12's stdlib -- setuptools' distutils shim brings
          # it back. Without it that line fails under cygport's `set -e`
          # and `cygport dep` silently prints nothing, leaving README's
          # "Runtime requirements:" empty for any package shipping a
          # python3-shebang script.
          packages: ${{ steps.depends.outputs.extra_packages }} ${{ inputs.cygwin_packages }} python312-setuptools
          # See Install Cygwin (base toolchain) above for why this is
          # necessary at all -- same reasoning applies to every package
          # install in this job.
          site: "http://mirrors.kernel.org/sourceware/cygwin/ https://dist.yacp.dev/"
          check-sig: false

      # shared-mime-info's postinstall can fail inside the install action
      # without failing the step, leaving GIO/gdk-pixbuf unable to sniff
      # any file type. See the script for the failure it fixes.
      - name: Refresh MIME database
        run: bash -- scripts/refresh_mime_database.sh

      - name: Install xezat (latest from GitHub)
        run: bash -- scripts/xezat_install.sh

      # xezat's own `bashvar` (used by prep/bump/validate/port alike, via
      # Xezat#variables) dies outright on a single invalid UTF-8 byte
      # anywhere in cygport's internal variable dump, not just this
      # package's own cygport file's variables (confirmed against a real
      # failure, libgedit-amtk 5.10.0, and against that package's
      # committed cygport file decoding as clean UTF-8 on its own, ruling
      # out the package's own content as the source). See
      # scripts/bashvar_diagnostic_patch.rb for the full story and why it
      # never logs variable values, only names/byte positions.
      - name: Configure bashvar diagnostic patch
        run: bash -- scripts/configure_bashvar_diagnostic.sh

      - name: xezat prep
        id: prep
        run: bash -- scripts/xezat_prep.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      - name: cygport compile
        id: compile
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}" --step compile

      # configure_cygport.sh's acsite.m4 makes autoconf (run by
      # cygautoreconf, inside src_compile) fail on an AX_*/PKG_* macro
      # whose .m4 isn't installed -- usually a missing autoconf-archive or
      # pkgconf in BUILD_REQUIRES (doc/spec.md 4.3.1). Pulls just those
      # error lines out of cygport's own compile log for the run summary,
      # while it's still on disk (a step failing doesn't tear down the
      # rest of the job's filesystem); scoped to compile's own failure via
      # steps.compile.outcome.
      - name: Diagnose undefined macro
        id: diagnose-macro
        if: failure() && steps.compile.outcome == 'failure'
        run: bash -- scripts/diagnose_undefined_macro.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      # Non-fatal by design: a test suite failing (or hanging -- some
      # need a display, network access, or other things a CI runner
      # doesn't have) says something about the package worth knowing, but
      # isn't reason enough to withhold the PR/artifact over, unlike an
      # actual compile/install/package failure. continue-on-error swallows
      # the failure so later steps still run; timeout-minutes caps how
      # long a hang can hold the job (check_timeout_minutes input,
      # default 10 -- override per-run for a package with a genuinely
      # slow test suite).
      #
      # fromJSON() is required despite `check_timeout_minutes` already
      # being declared `type: number`: workflow_dispatch inputs are still
      # plain strings in the `inputs` expression context regardless of
      # their declared type (only the dispatch UI's input form actually
      # validates against it), and timeout-minutes rejects a string
      # outright ("The template is not valid... Unexpected value '10'",
      # confirmed by a real run -- the step ran anyway with no effective
      # timeout at all, rather than failing the workflow, which is what
      # made this easy to miss).
      - name: cygport check
        id: check
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(inputs.check_timeout_minutes) }}
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}" --step check

      # continue-on-error above leaves both the run and the step's own
      # conclusion green when tests fail -- only steps.check.outcome
      # says so -- and the reason sits in a test log that never leaves the
      # runner (libeconf 0.8.6: 73/73 tests at exit status 127, nothing
      # in the job log saying why). Pulls the summary, up to 3 distinct
      # failing tests' log blocks, and cygcheck/a direct run of the first
      # failing executable out
      # for the job summary and the PR body below. No failure() here: the
      # job is still succeeding at this point. timeout-minutes in case
      # running the executable hangs anyway: without it, the step waits
      # until the 6-hour job limit and the run is cancelled with no PR.
      - name: Diagnose check failure
        id: diagnose-check
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        run: bash -- scripts/diagnose_check_failure.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      # A check that ran no tests passes just the same (a src_test of
      # `:`, cygtest finding no check/test target, ctest/meson finding
      # none), so a green check alone doesn't say the suite was reached.
      # Says so in the job summary and the PR body, for whoever fixes the
      # recipe to look at whether upstream has tests src_test misses.
      - name: Detect empty check
        id: empty-check
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: bash -- scripts/detect_empty_check.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      - name: cygport install
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}" --step install

      # Purely informational -- cygport's own `list` step (__list_files)
      # prints the staged install tree ($D) to the log, so a run's output
      # makes it easy to eyeball what actually got installed where
      # without needing to reproduce the build locally.
      - name: cygport list
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}" --step list

      - name: cygport package
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}" --step package

      - name: Validate build
        run: bash -- scripts/validate_recipe.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      # Feeds Decide changelog message below. gcc-core is always
      # installed as part of the base toolchain (see Install Cygwin (base
      # toolchain) above), so this doesn't need its own package install.
      - name: Detect gcc-core version
        id: gcc-version
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        run: bash -- scripts/gcc_version.sh

      # A release-only bump (`rebuild`/`gcc-rebuild`, or a branch-rebuild
      # re-run of one -- where the release isn't bumped again) gets
      # "Rebuild with gcc-<ver>"/"Rebuild" instead of xezat's default
      # "Version bump.", decided by comparing against yacp's HEAD rather
      # than trusting the resolved mode -- see changelog_message.sh. A non-empty
      # `changelog_message` input overrides whatever this decides (see
      # Update README via xezat below).
      - name: Decide changelog message
        id: changelog
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        run: bash -- scripts/changelog_message.sh --dir yacp --package "${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}" --gcc-version "${{ steps.gcc-version.outputs.gcc_version }}"

      # Skipped entirely for deploy: there's no PR to carry a
      # rewritten README to, and the changelog already has whatever entry
      # a real (or previously-failed) build already gave it -- rewriting
      # it here would just clobber that with a message that isn't true,
      # nothing was bumped.
      - name: Update README via xezat
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        env:
          XEZAT_BUMP_MESSAGE: ${{ inputs.changelog_message || steps.changelog.outputs.message }}
        run: bash -- scripts/xezat_bump.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      # validate_recipe.sh only checks that LICENSE is set and that every
      # BUILD_REQUIRES package is installed (plus the BOM, CATEGORY,
      # HOMEPAGE/LICENSE_URI reachability, *-config, *.pc and AppStream
      # path).
      # This checks LICENSE against the headers and license texts of what
      # the packages ship
      # (installed files and the sources compiled into them), and each
      # BUILD_REQUIRES package for evidence the build used it (a DLL
      # import, a file the compiler read, a mention in the logs) -- both
      # go stale silently in a recipe carried from version to version.
      # It lists what the build looked for and didn't find that a Cygwin
      # package not in BUILD_REQUIRES provides (cygcheck -p), since a
      # missing optional dependency drops part of the package silently.
      # It also checks that README's runtime requirements came out, since
      # `cygport dep` (run by xezat bump) prints nothing on a failure
      # without failing, which is why it runs after Update README via
      # xezat. Warnings only, so continue-on-error too: the report goes to
      # the run summary, the PR body just says there is one.
      - name: Audit recipe
        id: audit
        continue-on-error: true
        run: bash -- scripts/audit_recipe.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      # cygport's `install` step (above) already runs postinst as part of
      # itself (see cygport's own src_postinst.cygpart/bin/cygport.in:
      # `install` runs `src_install && __src_postinst`), which is what
      # embeds $C/README into $D as /usr/share/doc/Cygwin/$PN.README --
      # but at that point $C/README was still the pre-bump copy xezat
      # prep put there. Now that xezat bump has rewritten it, it has to be
      # re-embedded, and package needs to run again too so the actual
      # dist archive picks up that change -- otherwise the shipped package
      # would carry the stale changelog forever. Not by re-running
      # `cygport postinst`: its doc install isn't idempotent (a second
      # pass adds README.md next to README) -- see embed_readme.sh.
      # Both skipped for deploy along with Update README via xezat
      # above -- there's no updated README to re-embed, so the package
      # step above (before it, using whatever README was already
      # committed) is already the real dist artifact.
      - name: Embed updated README
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        run: bash -- scripts/embed_readme.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      - name: cygport package (with updated README)
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}" --step package

      # xezat bump only rewrites the build tree's own README copy ($C),
      # never the package directory's tracked one -- see xezat_port.sh for
      # why. `xezat port` is what copies it (plus the cygport file itself
      # and any src.patch) back. Skipped for deploy: nothing was
      # bumped/rewritten to port back, and there's no PR to carry it
      # to anyway. It also warns when the regenerated .src.patch no longer
      # changes a file the recipe's own did (cygport diff's excludes, e.g.
      # `*.h.in`), which the PR body then says.
      - name: Copy build results back via xezat port
        id: port
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        run: bash -- scripts/xezat_port.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}"

      # Mainly so a run's log makes it easy to eyeball whether xezat
      # bump/port did the right thing, without waiting for the Create
      # Pull Request step below or opening its PR. Bump release's rename
      # and the branch overlay can leave changes uncommitted (a plain
      # filesystem rename, not `git mv`), so new names can be untracked as
      # far as git is concerned -- plain `git diff` never shows untracked files
      # at all, only changes to files it already tracks. Stage everything
      # first so the new files show up too. (Create Pull Request does its
      # own staging independently via add-paths, so this step's staging
      # isn't load-bearing for the PR itself -- it's just for this log.)
      # The diff itself covers the whole index rather than just the
      # package directory, so whatever Overlay branch content staged
      # elsewhere (e.g. a renamed-away old package directory's deletion)
      # shows up too.
      #
      # cygport's own build tree (<PN>-<PV>-<PR>.<arch>/) lives inside the
      # package directory too, and `git add -A` walks into it -- it's not
      # meant to be committed (and Upload dist artifact still needs to
      # read it below, so it can't just be deleted here), and it contains
      # a symlink that Windows Git can't index ("Function not
      # implemented"), which aborts the whole `git add` rather than just
      # skipping that one file. Exclude it via pathspec instead. The
      # trailing "/**" (not just "/*") is required for the exclude to
      # match paths *inside* the directory, not just the directory itself.
      #
      # xezat also drops its own cache of the cygport file's extracted
      # variables right next to it, named "<cygport-basename>.<uname
      # -m>.yml" (e.g. last-1654-1bl1.x86_64.yml -- see xezat's
      # variables.rb), every time it parses the cygport file (prep/bump/
      # port all do). That's a local speedup, not something to commit.
      #
      # Packages that `inherit git` (GIT_URI/GIT_TAG instead of a plain
      # SRC_URI tarball) are a third case: cygport's own git.cygclass
      # (git_fetch()) always writes the tarball it builds from the clone
      # to "${top}/${git_tarball}" -- the package directory itself, *not*
      # DISTDIR (confirmed against cygport's actual source; DISTDIR only
      # applies to src_fetch.cygpart's plain-URL path) -- so
      # configure_cygport.sh can't redirect it, and it isn't inside
      # *.x86_64/ either, confirmed by a real run (htslib) committing an
      # untracked htslib-<PV>.tar.bz2 nobody wanted. yacp's own convention
      # never commits these even for existing git-sourced packages, so
      # exclude the pattern outright.
      #
      # if: always() (rather than the default success-only) so this still
      # shows the rename even when a later step -- cygport compile, most
      # commonly -- is what actually failed (doc/spec.md 4.6): there's
      # nothing to show yet if Detect existing cygport itself is what
      # failed, hence the outcome check.
      - name: Show diff
        if: always() && steps.detect.outcome == 'success'
        run: |
          git -C yacp add -A -- ${{ needs.gate.outputs.package }} ":(exclude)${{ needs.gate.outputs.package }}/*.x86_64/**" ":(exclude)${{ needs.gate.outputs.package }}/*.x86_64.yml" ":(exclude)${{ needs.gate.outputs.package }}/*.tar.*"
          git -C yacp diff --cached

      - name: Upload dist artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }}-dist
          # A `**/dist/**` glob has to walk every subdirectory to find
          # matches, including .../<pn>-<pv>-<pr>.x86_64/build/ -- which
          # contains files coming out of the Cygwin build (e.g. a checked-
          # out .gitattributes) that Node's fs.stat can't read on Windows
          # ("EACCES: permission denied"), aborting the whole upload. The
          # single `*` here only matches the one known directory-name
          # pattern, so it never needs to look inside build/ at all.
          path: yacp/${{ needs.gate.outputs.package }}/*.x86_64/dist/**
          if-no-files-found: error

      # peter-evans/create-pull-request stashes any leftover uncommitted/
      # untracked changes (via `git stash push --include-untracked`)
      # after committing the add-paths'd files, to restore the working
      # tree afterwards -- and that stash walks the cygport build tree
      # too, hitting the same symlink Windows Git can't index that Show
      # diff's `git add -A` already had to route around ("Function not
      # implemented", confirmed by the actual failure in run
      # 31302451178). Unlike a plain `git add -A`, there's no pathspec
      # input to make the action's own stash skip it, so remove the
      # build tree instead, via cygport's own `clean` step (== `finish`,
      # `rm -rf` of the whole per-arch work directory -- safe to run now
      # since Upload dist artifact above already read what it needed out
      # of it, when there was anything to read). Cygwin's own `rm -rf`
      # handles the symlink fine; it's only Windows Git's tooling that
      # can't.
      #
      # if: always() (see Show diff above) so the build tree also gets out
      # of the way of Create draft Pull Request on the failure path
      # (doc/spec.md 4.6) -- not just the success-only Create Pull
      # Request below.
      - name: cygport clean
        if: always() && steps.detect.outcome == 'success'
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ needs.gate.outputs.package }}" --file "${{ steps.detect.outputs.cygport_file }}" --step clean

      # GitHub App installation tokens expire after 1 hour, and a full
      # Windows build (plus a cold xezat gem compile) can easily outlast
      # the one Generate yacp token minted at the start of the job -- so
      # mint a fresh one for everything from here on (create-pull-request
      # uses its own `token` input for the push too, overriding the
      # credentials Checkout yacp persisted). Same condition as either
      # Create Pull Request step below could run under.
      - name: Refresh yacp token
        id: app-token-pr
        if: always() && steps.detect.outcome == 'success' && needs.gate.outputs.mode != 'deploy'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DORGANN_APP_ID }}
          private-key: ${{ secrets.DORGANN_APP_PRIVATE_KEY }}
          owner: yacp-dev
          repositories: ports

      # Placed after the artifact upload so a problem here (still
      # unvalidated as of Step 2 -- first real use of the yacp token) can't
      # cost the dist artifact too.
      #
      # add-paths defaults to `git add -A` over the whole checkout if
      # omitted, which would re-add the build tree/cache junk Show diff
      # deliberately excludes above -- pass the identical pathspec here
      # so this step's own staging (it doesn't reuse Show diff's) stays
      # consistent with it.
      #
      # branch is deterministic (package+version, not run id), so
      # re-running this workflow for the same package/version updates
      # the existing PR/branch instead of piling up duplicates --
      # create-pull-request's own designed behavior for this case.
      #
      # base: master is set explicitly rather than relying on the default
      # (whatever ref Checkout yacp checked out) purely as cheap, always-
      # correct documentation -- Checkout yacp only ever checks out
      # master now (see its own comment for why an earlier attempt at
      # checking out the branch directly here broke this action's base-
      # branch reconciliation), so this is redundant in practice, not
      # load-bearing.
      - name: Create Pull Request
        id: create-pr
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token-pr.outputs.token }}
          path: yacp
          # Attribute the commit to the App's bot too, not just the PR
          # -- see Resolve bot identity above.
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          base: master
          add-paths: |
            ${{ needs.gate.outputs.package }}
            :(exclude)${{ needs.gate.outputs.package }}/*.x86_64/**
            :(exclude)${{ needs.gate.outputs.package }}/*.x86_64.yml
            :(exclude)${{ needs.gate.outputs.package }}/*.tar.*
          branch: dorgann/${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }}
          delete-branch: true
          # "<PN>-<PV>", no colon or verb, matches yacp's own existing
          # commit message convention (checked against its git history).
          commit-message: "${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }}"
          title: "${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }}"
          # Leaving `draft` unset (defaults to false) does NOT un-draft an
          # existing draft PR on update, contrary to what
          # peter-evans/create-pull-request's own docs implied -- confirmed
          # by a real branch-rebuild success (title/body updated correctly,
          # but isDraft stayed true). Mark Pull Request ready for review
          # below handles it explicitly instead.
          #
          # The dorgann-meta HTML comment mirrors the machine-parseable
          # metadata convention doc/spec.md 4.7 uses for update-blocked
          # Issues -- an HTML comment survives copy/paste and markdown
          # reformatting better than expecting something to scrape a
          # human-facing code block. artifact-id is actions/upload-
          # artifact's own step output (v4+), not something computed here.
          #
          # The check line is empty unless cygport check failed, which
          # otherwise leaves no trace on a green run (see Diagnose check
          # failure); the diagnostic itself goes to the run summary rather
          # than here, to keep a possibly long log excerpt out of the PR.
          # Likewise the empty-check line, unless check ran no tests, and
          # the audit line, unless Audit recipe warned, the dependencies
          # line, unless it named Cygwin packages the build looked for and
          # didn't find, and the .src.patch line, unless xezat port's
          # patch lost a file.
          body: |
            Version `${{ steps.detect.outputs.version }}`, built and validated by [dorgann](https://github.com/yacp-dev/dist).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{ steps.check.outcome == 'failure' && '**`cygport check` failed** (non-blocking) -- see the run summary for why.' || '' }}

            ${{ steps.empty-check.outputs.reason && format('**`cygport check` ran no tests** ({0}).', steps.empty-check.outputs.reason) || '' }}

            ${{ steps.audit.outputs.warnings && format('**Recipe audit**: {0} warning(s) about LICENSE/BUILD_REQUIRES/runtime requirements -- see the run summary.', steps.audit.outputs.warnings) || '' }}

            ${{ steps.audit.outputs.candidates && format('**Dependencies the build didn''t find**: Cygwin has them in `{0}`, not in `BUILD_REQUIRES` -- adding them may build more of the package; see the run summary.', steps.audit.outputs.candidates) || '' }}

            ${{ steps.port.outputs.dropped_files && format('**`.src.patch` lost changes**: `cygport diff` left out `{0}`, which this build patched but the committed recipe no longer does -- move them into a `PATCH_URI` patch of their own.', steps.port.outputs.dropped_files) || '' }}

            <!-- dorgann-meta: {"artifact_id":"${{ steps.upload.outputs.artifact-id }}"} -->

            To publish this build to gh-pages:
            ```
            gh workflow run publish.yml -f artifact_id=${{ steps.upload.outputs.artifact-id }} --repo ${{ github.repository }}
            ```

      # Only matters in branch-rebuild mode (doc/spec.md 4.6): a fresh-
      # bump-mode PR is never a draft in the first place (Create draft
      # Pull Request below only runs on the failure path), so this is a
      # harmless no-op for that case. `gh pr ready` on an already-ready PR
      # is idempotent. Skipped for deploy along with Create Pull
      # Request above -- steps.create-pr.outputs.pull-request-number is
      # empty when that step didn't run, and `gh pr ready` with an empty
      # argument would just error.
      - name: Mark Pull Request ready for review
        if: ${{ needs.gate.outputs.mode != 'deploy' }}
        env:
          GH_TOKEN: ${{ steps.app-token-pr.outputs.token }}
        run: gh pr ready ${{ steps.create-pr.outputs.pull-request-number }} --repo yacp-dev/ports

      # Branch-rebuild mode's entry point (doc/spec.md 4.6). Mirrors
      # Create Pull Request above (same deterministic branch name, so
      # re-running this workflow for the same package/version updates the
      # same branch/PR either action created), but only runs on the
      # failure path, and only if there's actually something to push --
      # Detect existing cygport succeeding means the package directory was
      # read successfully, even though the build itself failed later. This gives a human a concrete branch to pull,
      # fix by hand (add a missing BUILD_REQUIRES, rename PKG_NAMES for an
      # ABI bump, ...), and push straight back to -- at which point
      # re-running this workflow with the same <package>-<version> picks
      # the fix up (the branch already carries the bump) and re-validates
      # it for real.
      #
      # deploy is excluded explicitly here too (matching Create
      # Pull Request above) rather than relying on there being no diff to
      # push -- confirmed by a real run (socket++ 1.12.13) that
      # peter-evans/create-pull-request happens to no-op gracefully
      # ("Branch ... is not ahead of base 'master' and will not be
      # created") when deploy genuinely has nothing to commit, but
      # that's an implicit consequence of deploy having no bump of its own,
      # not a guarantee -- explicit is safer than depending on it.
      - name: Create draft Pull Request (on failure)
        id: create-draft-pr
        if: failure() && steps.detect.outcome == 'success' && needs.gate.outputs.mode != 'deploy'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token-pr.outputs.token }}
          path: yacp
          # See Create Pull Request above.
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          # See Create Pull Request above -- redundant in practice, kept
          # as documentation.
          base: master
          add-paths: |
            ${{ needs.gate.outputs.package }}
            :(exclude)${{ needs.gate.outputs.package }}/*.x86_64/**
            :(exclude)${{ needs.gate.outputs.package }}/*.x86_64.yml
            :(exclude)${{ needs.gate.outputs.package }}/*.tar.*
          branch: dorgann/${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }}
          delete-branch: true
          draft: true
          commit-message: "${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }}"
          # Same "<PN>-<PV>" title as Create Pull Request above -- whether
          # it built is what draft status and the body are for, not the
          # title. Keeping it identical also means the eventual successful
          # re-run doesn't need to change the title at all, only the draft
          # status (Mark Pull Request ready for review) and body.
          title: "${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }}"
          body: |
            Version `${{ steps.detect.outputs.version }}`, but the build failed -- see the run summary and log below for what's wrong.

            Push a fix directly onto this branch (`dorgann/${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }}`), then re-run the build against it:
            ```
            gh workflow run build-package.yml -f target=${{ needs.gate.outputs.package }}-${{ steps.detect.outputs.version }} --repo ${{ github.repository }}
            ```

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Genuinely last step, if: always() so it runs whichever of the
      # above actually fired. GitHub renders $GITHUB_STEP_SUMMARY as
      # Markdown right at the top of the run page, unlike a plain log
      # line, which is only visible after opening this specific job and
      # scrolling to the right step.
      #
      # The PR link is a concatenation of the (at most one non-empty)
      # Create Pull Request/Create draft Pull Request step outputs above,
      # same pattern as the version/cygport_file outputs earlier in this
      # file -- whichever step actually ran is the one whose output
      # survives.
      - name: Write job summary
        if: always()
        run: bash -- scripts/write_job_summary.sh --package "${{ needs.gate.outputs.package }}" --pr-url "${{ steps.create-pr.outputs.pull-request-url }}${{ steps.create-draft-pr.outputs.pull-request-url }}" --artifact-id "${{ steps.upload.outputs.artifact-id }}" --macro-diagnostic-file "${{ steps.diagnose-macro.outputs.diagnostic_file }}" --check-diagnostic-file "${{ steps.diagnose-check.outputs.diagnostic_file }}" --check-empty-reason "${{ steps.empty-check.outputs.reason }}" --audit-file "${{ steps.audit.outputs.report_file }}" --audit-warnings "${{ steps.audit.outputs.warnings }}" --audit-candidates "${{ steps.audit.outputs.candidates }}"
