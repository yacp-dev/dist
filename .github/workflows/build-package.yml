name: build-package

# Step 1 (doc/spec.md, chapter 7): validates that a cygport build
# actually works on a windows-latest Actions runner.
# Step 2: adds PR creation against yacp (doc/spec.md 4.4.1). package/
# version are still manual workflow_dispatch inputs -- that's Step 3.
# Step 5: files a build-failed Issue (doc/spec.md 4.5) if any step above
# fails, and closes it back out on a later success (4.4) -- implemented
# out of numeric order, same as Step 6, since it doesn't depend on Steps
# 3/4's daily-cron loop at all; only that loop's own skip-if-already-
# failed check (4.2) is still deferred to whenever Step 4 lands.
#
# xezat handles fetching/preparing sources (`xezat prep`, before the
# build), regenerating the package's README/changelog (`xezat bump`,
# after it), and copying the build's results (cygport file, README,
# src.patch) back into the package directory (`xezat port`, after that).
# `xezat prep` copies the package directory's README into the build tree,
# which is what `xezat bump` later reads and appends a changelog entry to
# -- that copy step is why xezat prep is used here instead of a plain
# `cygport ... download`/`prep` (which would leave xezat bump editing a
# stale/absent README). `xezat bump` only ever writes back to that same
# build-tree copy, never to the package directory -- `xezat port` is what
# copies it (and the cygport file itself, and any src.patch) back out;
# without it, the package directory's tracked README would never actually
# change. Using xezat at
# all was originally deferred as an unverified Windows-Ruby risk (xezat
# depends on github-linguist, which pulls in native-extension gems:
# rugged and charlock_holmes), but now runs against a real Cygwin
# ruby/gem (installed below) rather than the windows-latest runner's
# preinstalled native Windows Ruby, which is a much more plausible
# environment for those gems to build in -- xezat itself only works
# under genuine Cygwin anyway, since it sources the real /usr/bin/cygport
# as a bash script.
#
# xezat itself is installed from the HEAD of its own GitHub repository
# (scripts/xezat_install.sh) rather than a pinned RubyGems.org release, so
# unreleased fixes are always picked up.
#
# Compiling rugged/charlock_holmes's native extensions from scratch is
# slow (cmake-building vendored libgit2, linking ICU), so the gem
# install is cached across runs -- see scripts/xezat_cache_info.sh for
# why the cache key includes a hash of every installed Cygwin package's
# version (and xezat's own HEAD commit) rather than being a fixed string.
#
# Build dependencies are determined in two passes, mirroring how Cygwin's
# own official CI (cygwin/scallywag) does it: a fixed base toolchain is
# always installed first, then scripts/cygport_depends.sh asks cygport
# itself (via `cygport <file> vars ...`) what extra packages the specific
# cygport file needs. cygwin_packages remains available as a manual
# fallback for whatever the auto-detection doesn't cover.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory name in yacp (e.g. pkg)"
        required: true
        type: string
      version:
        description: "New version (PV) to build (required unless branch is set)"
        required: false
        type: string
        default: ""
      branch:
        description: "Rebuild an existing yacp branch as-is (doc/spec.md 4.6), e.g. dorgann/pkg-x.y.z"
        required: false
        type: string
        default: ""
      cygwin_packages:
        description: "Extra Cygwin packages to install on top of auto-detected ones (space-separated, e.g. pkg-devel)"
        required: false
        type: string
        default: ""
      check_timeout_minutes:
        description: "Timeout (minutes) for cygport check -- failures/timeouts there don't block the PR"
        required: false
        type: number
        default: 10
      rebuild:
        description: "Rebuild the same version, bumping only the release number (1bl1 -> 1bl2) for a toolchain-only rebuild (e.g. newer gcc) with no source changes. Ignored if branch is set (or auto-detected)."
        required: false
        type: boolean
        default: false
      validate_only:
        description: "Build the package exactly as currently committed in yacp (no version/release bump), skip yacp PR creation entirely, and just upload the dist artifact -- for validating/publishing an already-merged fix dorgann never actually built (e.g. a branch-rebuild fix pushed and merged without a re-run). Ignored if branch is set (or auto-detected) or rebuild is set."
        required: false
        type: boolean
        default: false

# issues:write for report_build_failure.sh/close_failure_issue.sh
# (doc/spec.md 4.5).
permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # windows-latest runners default to core.autocrlf=true, which
      # rewrites LF to CRLF on checkout and breaks bash reading any script
      # file directly ("$'\r': command not found") -- including yacp's own
      # .cygport files, which cygport itself sources as a bash script.
      # dorgann's own files are additionally covered by .gitattributes,
      # but that only applies within this repo, not the yacp-dev/ports checkout
      # below, so this has to be set globally before either checkout runs.
      - name: Disable line-ending conversion on checkout
        run: git config --global core.autocrlf false

      - name: Checkout dorgann
        uses: actions/checkout@v7

      # dorgann's own default GITHUB_TOKEN is scoped to dorgann only and
      # can't push to yacp, so everything touching yacp-dev/ports below
      # uses a GitHub App installation token instead (doc/spec.md 4.4.1)
      # -- an App rather than a PAT so the branches/PRs it creates are
      # attributed to the App's own bot account, not to whoever owns the
      # token. The App needs Contents: Read and write and Pull requests:
      # Read and write on yacp-dev/ports.
      - name: Generate yacp token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DORGANN_APP_ID }}
          private-key: ${{ secrets.DORGANN_APP_PRIVATE_KEY }}
          owner: yacp-dev
          repositories: ports

      # create-pull-request's `author` defaults to github.actor (whoever
      # ran workflow_dispatch), so without overriding it the commits
      # would still count toward that person's contributions even though
      # the PR itself is the bot's. The bot's noreply address needs its
      # numeric user id, which the token step doesn't output directly.
      # shell: bash explicitly, since windows-latest defaults to pwsh.
      - name: Resolve bot identity
        id: bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "identity=${APP_SLUG}[bot] <${id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Checkout yacp
        uses: actions/checkout@v7
        with:
          repository: yacp-dev/ports
          path: yacp
          # Always yacp-dev/ports's own default branch, even in branch-rebuild
          # mode (doc/spec.md 4.6) -- checking out `inputs.branch` here
          # directly was tried first and broke peter-evans/create-pull-
          # request's own base-branch reconciliation (confirmed by a real
          # run: with nothing newly committed during a run that only
          # re-validates an already-fixed branch, it collapsed the whole
          # branch down to be byte-identical to base and deleted/closed it
          # outright). Overlay branch content below brings the branch's
          # fix in as a plain uncommitted diff against this checkout
          # instead, which doesn't have that problem.
          #
          # The App token (see Generate yacp token above) is needed on
          # checkout too, not just on the Create Pull Request step below,
          # since that's what determines which credentials `git push`
          # inside this checkout uses.
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Cygwin (base toolchain)
        uses: cygwin/cygwin-install-action@v6
        with:
          # cygport itself already depends on autoconf/automake/libtool/
          # make/binutils etc., but not on a compiler -- see doc/spec.md
          # and scripts/cygport_depends.sh for why gcc isn't detected
          # per-package. python3/ruby/rubygems aren't for building the
          # package itself either: cygport's own packaging phase
          # (pkg_info.cygpart) unconditionally probes for ruby+gem to
          # generate runtime dependency metadata, and separately scans
          # installed files for a python3 shebang to do the same -- e.g.
          # yacp/last ships C++ binaries alongside python3-shebang helper
          # scripts. Without a real Cygwin ruby/gem here, that probe was
          # instead finding the windows-latest runner's preinstalled
          # native Windows Ruby, whose RubyGems API cygport's script
          # doesn't expect (NoMethodError on Gem.default_dirs).
          packages: cygport util-linux sed gcc-core gcc-g++ python3 ruby rubygems
          # Setting `site` at all replaces this action's own default
          # (confirmed empty in action.yml itself -- the actual mirror
          # fallback is hardcoded in the action's own implementation, not
          # a declared input default), so the real mirror has to be
          # spelled out here alongside dorgann's own gh-pages (chapter 3)
          # -- otherwise this would only ever be able to see packages
          # dorgann itself has published, losing the rest of Cygwin
          # entirely. Lets a build depend on another package that's only
          # ever been published here, not (yet, or at all) in the
          # official archive.
          #
          # The literal fd0.app URL, not the plain <owner>.github.io one,
          # since that's what's actually confirmed to work (doc/spec.md
          # 3.1's account-level custom-domain caveat) -- needs updating if
          # dorgann ever moves to a different org/domain.
          site: "http://mirrors.kernel.org/sourceware/cygwin/ https://fd0.app/dorgann/"
          # publish.yml's own release area (3.2) never generates .sig
          # files -- that's calm's own maintainer-upload signing step on
          # the real Cygwin infrastructure, not something in use here --
          # so check-sig's default (true) would reject every package
          # dorgann's own gh-pages site actually serves.
          check-sig: false

      # Once Cygwin is installed, its own git ends up ahead of Git for
      # Windows on PATH for the rest of the job -- including in steps
      # that don't explicitly say `bash --` (e.g. Show diff below), since
      # PATH is a job-wide env var, not something bash-specific. Cygwin's
      # git then refuses to touch the yacp checkout at all ("detected
      # dubious ownership in repository at '/cygdrive/...'", confirmed by
      # a real run) -- actions/checkout (a native Windows/Node action)
      # and Cygwin's own git disagree about whose file-ownership check
      # the directory should satisfy. `--global` writes to `$HOME/
      # .gitconfig`, and bash-invoked vs. plain steps have historically
      # disagreed about what $HOME even is on this runner (see Configure
      # cygport below) -- so this is set both ways rather than trusting
      # either alone to cover every later step that touches yacp.
      #
      # core.autocrlf false is set alongside it for the same reason:
      # "Disable line-ending conversion on checkout" above only configures
      # whichever git that plain (non-bash) step resolves to, which at
      # that point in the job (before Cygwin's installed) is Git for
      # Windows -- never Cygwin's own git, which is what `cygport fetch`
      # actually shells out to (via xezat prep, itself a `bash --` step)
      # for every upstream source clone from here on. Left at whatever
      # Cygwin's git defaults to, a patch generated against a plain LF
      # checkout can fail to apply against a CRLF-converted one at every
      # -p level cygport tries, with no more detail than "will not apply"
      # (confirmed against a real run -- htslib's src.patch, verified
      # byte-for-byte correct against the actual upstream Makefile, still
      # wouldn't apply in CI while applying fine locally).
      - name: Configure git safe.directory (Cygwin)
        run: bash -c "git config --global --add safe.directory '*' && git config --global core.autocrlf false"

      - name: Configure git safe.directory (Windows)
        run: git config --global --add safe.directory '*'

      # Must run after Cygwin is installed (and installed early, before
      # anything that could invoke `cygport fetch`, i.e. `xezat prep`
      # below): a bare `bash` on windows-latest resolves to Git for
      # Windows' bash until cygwin-install-action puts Cygwin's own bash
      # ahead of it on PATH, and the two have different $HOME values --
      # writing this config under the wrong one would make cygport never
      # see it.
      - name: Configure cygport
        run: bash -- scripts/configure_cygport.sh

      # Auto-detects branch-rebuild mode (doc/spec.md 4.6) when `branch`
      # wasn't given explicitly: if dorgann/<package>-<version> already
      # exists in yacp (typically left over from an earlier failed run's
      # own draft PR), there's no reason to make re-running with just
      # package+version fail on bump_version.sh's "already at this
      # version" refusal -- just rebuild that branch instead. A pure API
      # call, so it doesn't need yacp checked out locally first.
      - name: Detect existing branch (auto branch-rebuild)
        id: auto-branch
        if: inputs.branch == '' && inputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash -- scripts/detect_existing_branch.sh --repo yacp-dev/ports --package "${{ inputs.package }}" --version "${{ inputs.version }}"

      # Branch-rebuild mode (doc/spec.md 4.6): brings the target branch's
      # version of the package directory in as a plain uncommitted diff
      # against the master checkout above, rather than checking out the
      # branch itself (see Checkout yacp for why that broke). Must run
      # before Detect existing cygport below, which reads this directory.
      # `branch` is `inputs.branch` when given explicitly, or whatever
      # Detect existing branch found otherwise -- same concatenation
      # trick as the version/cygport_file outputs below, since at most
      # one of the two is ever non-empty.
      - name: Overlay branch content (branch-rebuild mode)
        if: inputs.branch != '' || steps.auto-branch.outputs.branch != ''
        run: bash -- scripts/overlay_branch_package.sh --dir yacp --package "${{ inputs.package }}" --branch "${{ inputs.branch }}${{ steps.auto-branch.outputs.branch }}"

      # Four mutually exclusive paths now: a version bump, a branch
      # rebuild (explicit or auto-detected above, doc/spec.md 4.6), a
      # same-version release rebuild (`rebuild`), or a validate-only build
      # of whatever's already committed (`validate_only`, for validating/
      # publishing an already-merged fix dorgann never actually built) --
      # exactly one of Bump version / Bump release / Detect existing
      # cygport's rename-or-not applies. Every step below still reads
      # through the concatenation of just the first and last steps'
      # outputs (e.g. "${{ steps.bump.outputs.X }}${{ steps.detect.outputs.X }}"),
      # which is always exactly one non-empty value since a skipped step's
      # outputs are the empty string, not an error -- Bump release and
      # validate_only deliberately have no outputs of their own and
      # instead let Detect existing cygport (widened below to also cover
      # both) pick up whatever's on disk (renamed, for Bump release; as-is
      # from the yacp checkout, for validate_only), so nothing below needs
      # touching for either to slot in.
      - name: Bump version
        id: bump
        if: inputs.branch == '' && steps.auto-branch.outputs.branch == '' && !inputs.rebuild && !inputs.validate_only
        run: bash -- scripts/bump_version.sh --dir "yacp/${{ inputs.package }}" --version "${{ inputs.version }}"

      # Same-version rebuild (no branch involved): bumps only the release
      # number (1bl1 -> 1bl2), for picking up a newer toolchain with no
      # source changes -- unlike Bump version above, which refuses to
      # touch a package already at the requested version. `branch`/auto-
      # detection above always wins over `rebuild` if somehow both apply.
      - name: Bump release (rebuild mode)
        if: inputs.rebuild && inputs.branch == '' && steps.auto-branch.outputs.branch == '' && !inputs.validate_only
        run: bash -- scripts/bump_release.sh --dir "yacp/${{ inputs.package }}"

      - name: Detect existing cygport (branch/release-rebuild mode)
        id: detect
        if: inputs.branch != '' || steps.auto-branch.outputs.branch != '' || inputs.rebuild || inputs.validate_only
        run: bash -- scripts/detect_cygport_file.sh --dir "yacp/${{ inputs.package }}"

      - name: Determine extra build dependencies
        id: depends
        run: bash -- scripts/cygport_depends.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}"

      - name: Install Cygwin (extra dependencies)
        uses: cygwin/cygwin-install-action@v6
        with:
          # libicu-devel/pkg-config/zlib-devel/ruby-devel/libgit2-devel
          # are not for building the package -- they're for `gem install
          # xezat` below (xezat depends on github-linguist -> rugged,
          # which needs ruby.h from ruby-devel to compile its own Ruby C
          # extension against, and links against Cygwin's own libgit2
          # package via pkg-config (RUGGED_USE_SYSTEM_LIBRARIES=1 below)
          # rather than cmake-building its vendored copy -- that vendored
          # build hit a Cygwin/CMake-specific "CMAKE_SIZEOF_VOID_P is
          # unset" failure detecting the compiler's pointer size, and
          # Cygwin's own libgit2-devel sidesteps it entirely; and
          # charlock_holmes, which needs ICU via pkg-config as
          # libicu-devel's icu-i18n/icu-io/icu-uc .pc files).
          packages: ${{ steps.depends.outputs.extra_packages }} ${{ inputs.cygwin_packages }} libicu-devel pkg-config zlib-devel ruby-devel libgit2-devel
          # See Install Cygwin (base toolchain) above for why this is
          # necessary at all -- same reasoning applies to every package
          # install in this job.
          site: "http://mirrors.kernel.org/sourceware/cygwin/ https://fd0.app/dorgann/"
          check-sig: false

      - name: Compute xezat cache info
        id: xezat-cache-info
        run: bash -- scripts/xezat_cache_info.sh

      - name: Cache xezat gem install
        uses: actions/cache@v6
        with:
          path: ${{ steps.xezat-cache-info.outputs.gem_home }}
          key: xezat-gem-${{ runner.os }}-${{ steps.xezat-cache-info.outputs.version_hash }}

      - name: Install xezat (latest from GitHub)
        env:
          RUGGED_USE_SYSTEM_LIBRARIES: "1"
        run: bash -- scripts/xezat_install.sh

      # xezat's own `bashvar` (used by prep/bump/validate/port alike, via
      # Xezat#variables) dies outright on a single invalid UTF-8 byte
      # anywhere in cygport's internal variable dump, not just this
      # package's own cygport file's variables (confirmed against a real
      # failure, libgedit-amtk 5.10.0, and against that package's
      # committed cygport file decoding as clean UTF-8 on its own, ruling
      # out the package's own content as the source). See
      # scripts/bashvar_diagnostic_patch.rb for the full story and why it
      # never logs variable values, only names/byte positions.
      - name: Configure bashvar diagnostic patch
        run: bash -- scripts/configure_bashvar_diagnostic.sh

      - name: xezat prep
        id: prep
        run: bash -- scripts/xezat_prep.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}"

      # cygport's own "patch ... will not apply" (from xezat prep above,
      # which is what actually invokes `cygport ... prep`) never says
      # which file/hunk/line conflicts -- cygpatch() (lib/src_prep.cygpart)
      # discards the patch tool's own diagnostic at every level it tries
      # (confirmed against cygport's source, and against a real failure,
      # yacp-dev/dist#23). Rerunning the dry-run ourselves, without that
      # suppression, against the same unpacked source tree (still on disk
      # here -- a step failing doesn't tear down the rest of the job's
      # filesystem) surfaces the real mismatch. Scoped to prep's own
      # failure specifically (not just failure() generally, e.g. a later
      # cygport compile failure has nothing to do with patch application)
      # via steps.prep.outcome.
      - name: Diagnose patch failure
        id: diagnose-patch
        if: failure() && steps.prep.outcome == 'failure'
        run: bash -- scripts/diagnose_patch_failure.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}"

      - name: cygport compile
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --step compile

      # Non-fatal by design: a test suite failing (or hanging -- some
      # need a display, network access, or other things a CI runner
      # doesn't have) says something about the package worth knowing, but
      # isn't reason enough to withhold the PR/artifact over, unlike an
      # actual compile/install/package failure. continue-on-error swallows
      # the failure so later steps still run; timeout-minutes caps how
      # long a hang can hold the job (check_timeout_minutes input,
      # default 10 -- override per-run for a package with a genuinely
      # slow test suite).
      #
      # fromJSON() is required despite `check_timeout_minutes` already
      # being declared `type: number`: workflow_dispatch inputs are still
      # plain strings in the `inputs` expression context regardless of
      # their declared type (only the dispatch UI's input form actually
      # validates against it), and timeout-minutes rejects a string
      # outright ("The template is not valid... Unexpected value '10'",
      # confirmed by a real run -- the step ran anyway with no effective
      # timeout at all, rather than failing the workflow, which is what
      # made this easy to miss).
      - name: cygport check
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(inputs.check_timeout_minutes) }}
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --step check

      - name: cygport install
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --step install

      # Purely informational -- cygport's own `list` step (__list_files)
      # prints the staged install tree ($D) to the log, so a run's output
      # makes it easy to eyeball what actually got installed where
      # without needing to reproduce the build locally.
      - name: cygport list
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --step list

      - name: cygport package
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --step package

      - name: Validate build via xezat
        run: bash -- scripts/xezat_validate.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}"

      # Feeds Decide changelog message below. gcc-core is always
      # installed as part of the base toolchain (see Install Cygwin (base
      # toolchain) above), so this doesn't need its own package install.
      - name: Detect gcc-core version
        id: gcc-version
        if: ${{ !inputs.validate_only }}
        run: bash -- scripts/gcc_version.sh

      # A release-only bump (`rebuild`, or a branch-rebuild re-run of
      # one -- where `rebuild` itself is ignored) gets "Rebuild with
      # gcc-<ver>"/"Rebuild" instead of xezat's default "Version bump.",
      # decided by comparing against yacp's HEAD rather than trusting
      # either input -- see changelog_message.sh.
      - name: Decide changelog message
        id: changelog
        if: ${{ !inputs.validate_only }}
        run: bash -- scripts/changelog_message.sh --dir yacp --package "${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --gcc-version "${{ steps.gcc-version.outputs.gcc_version }}"

      # Skipped entirely for validate_only: there's no PR to carry a
      # rewritten README to, and the changelog already has whatever entry
      # a real (or previously-failed) build already gave it -- rewriting
      # it here would just clobber that with a message that isn't true,
      # nothing was bumped.
      - name: Update README via xezat
        if: ${{ !inputs.validate_only }}
        env:
          XEZAT_BUMP_MESSAGE: ${{ steps.changelog.outputs.message }}
        run: bash -- scripts/xezat_bump.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}"

      # cygport's `install` step (above) already runs postinst as part of
      # itself (see cygport's own src_postinst.cygpart/bin/cygport.in:
      # `install` runs `src_install && __src_postinst`), which is what
      # embeds $C/README into $D as /usr/share/doc/Cygwin/$PN.README --
      # but at that point $C/README was still the pre-bump copy xezat
      # prep put there. Now that xezat bump has rewritten it, postinst
      # needs to run again on its own (cygport also exposes it as a
      # standalone step for exactly this) to re-embed the updated README
      # into $D, and package needs to run again too so the actual dist
      # archive picks up that change -- otherwise the shipped package
      # would carry the stale changelog forever.
      # Both skipped for validate_only along with Update README via xezat
      # above -- there's no updated README to re-embed, so the package
      # step above (before it, using whatever README was already
      # committed) is already the real dist artifact.
      - name: cygport postinst
        if: ${{ !inputs.validate_only }}
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --step postinst

      - name: cygport package (with updated README)
        if: ${{ !inputs.validate_only }}
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --step package

      # xezat bump only rewrites the build tree's own README copy ($C),
      # never the package directory's tracked one -- see xezat_port.sh for
      # why. `xezat port` is what copies it (plus the cygport file itself
      # and any src.patch) back. Skipped for validate_only: nothing was
      # bumped/rewritten to port back, and there's no PR to carry it
      # to anyway.
      - name: Copy build results back via xezat port
        if: ${{ !inputs.validate_only }}
        run: bash -- scripts/xezat_port.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}"

      # Mainly so a run's log makes it easy to eyeball whether xezat
      # bump/port did the right thing, without waiting for the Create
      # Pull Request step below or opening its PR. bump_version.sh
      # renamed the old .cygport/.src.patch on disk (a plain filesystem
      # rename, not `git mv`), so their new names are untracked as far as
      # git is concerned -- plain `git diff` never shows untracked files
      # at all, only changes to files it already tracks. Stage everything
      # first so the new files show up too. (Create Pull Request does its
      # own staging independently via add-paths, so this step's staging
      # isn't load-bearing for the PR itself -- it's just for this log.)
      #
      # cygport's own build tree (<PN>-<PV>-<PR>.<arch>/) lives inside the
      # package directory too, and `git add -A` walks into it -- it's not
      # meant to be committed (and Upload dist artifact still needs to
      # read it below, so it can't just be deleted here), and it contains
      # a symlink that Windows Git can't index ("Function not
      # implemented"), which aborts the whole `git add` rather than just
      # skipping that one file. Exclude it via pathspec instead. The
      # trailing "/**" (not just "/*") is required for the exclude to
      # match paths *inside* the directory, not just the directory itself.
      #
      # xezat also drops its own cache of the cygport file's extracted
      # variables right next to it, named "<cygport-basename>.<uname
      # -m>.yml" (e.g. last-1654-1bl1.x86_64.yml -- see xezat's
      # variables.rb), every time it parses the cygport file (prep/bump/
      # port all do). That's a local speedup, not something to commit.
      #
      # Packages that `inherit git` (GIT_URI/GIT_TAG instead of a plain
      # SRC_URI tarball) are a third case: cygport's own git.cygclass
      # (git_fetch()) always writes the tarball it builds from the clone
      # to "${top}/${git_tarball}" -- the package directory itself, *not*
      # DISTDIR (confirmed against cygport's actual source; DISTDIR only
      # applies to src_fetch.cygpart's plain-URL path) -- so
      # configure_cygport.sh can't redirect it, and it isn't inside
      # *.x86_64/ either, confirmed by a real run (htslib) committing an
      # untracked htslib-<PV>.tar.bz2 nobody wanted. yacp's own convention
      # never commits these even for existing git-sourced packages, so
      # exclude the pattern outright.
      #
      # if: always() (rather than the default success-only) so this still
      # shows the rename even when a later step -- cygport compile, most
      # commonly -- is what actually failed (doc/spec.md 4.6): there's
      # nothing to show yet if Bump version/Detect existing cygport itself
      # is what failed, hence the outcome check.
      - name: Show diff
        if: always() && (steps.bump.outcome == 'success' || steps.detect.outcome == 'success')
        run: |
          git -C yacp add -A -- ${{ inputs.package }} ":(exclude)${{ inputs.package }}/*.x86_64/**" ":(exclude)${{ inputs.package }}/*.x86_64.yml" ":(exclude)${{ inputs.package }}/*.tar.*"
          git -C yacp diff --cached -- ${{ inputs.package }}

      - name: Upload dist artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}-dist
          # A `**/dist/**` glob has to walk every subdirectory to find
          # matches, including .../<pn>-<pv>-<pr>.x86_64/build/ -- which
          # contains files coming out of the Cygwin build (e.g. a checked-
          # out .gitattributes) that Node's fs.stat can't read on Windows
          # ("EACCES: permission denied"), aborting the whole upload. The
          # single `*` here only matches the one known directory-name
          # pattern, so it never needs to look inside build/ at all.
          path: yacp/${{ inputs.package }}/*.x86_64/dist/**
          if-no-files-found: error

      # peter-evans/create-pull-request stashes any leftover uncommitted/
      # untracked changes (via `git stash push --include-untracked`)
      # after committing the add-paths'd files, to restore the working
      # tree afterwards -- and that stash walks the cygport build tree
      # too, hitting the same symlink Windows Git can't index that Show
      # diff's `git add -A` already had to route around ("Function not
      # implemented", confirmed by the actual failure in run
      # 31302451178). Unlike a plain `git add -A`, there's no pathspec
      # input to make the action's own stash skip it, so remove the
      # build tree instead, via cygport's own `clean` step (== `finish`,
      # `rm -rf` of the whole per-arch work directory -- safe to run now
      # since Upload dist artifact above already read what it needed out
      # of it, when there was anything to read). Cygwin's own `rm -rf`
      # handles the symlink fine; it's only Windows Git's tooling that
      # can't.
      #
      # if: always() (see Show diff above) so the build tree also gets out
      # of the way of Create draft Pull Request on the failure path
      # (doc/spec.md 4.6) -- not just the success-only Create Pull
      # Request below.
      - name: cygport clean
        if: always() && (steps.bump.outcome == 'success' || steps.detect.outcome == 'success')
        run: bash -- scripts/cygport_build.sh --dir "yacp/${{ inputs.package }}" --file "${{ steps.bump.outputs.cygport_file }}${{ steps.detect.outputs.cygport_file }}" --step clean

      # GitHub App installation tokens expire after 1 hour, and a full
      # Windows build (plus a cold xezat gem compile) can easily outlast
      # the one Generate yacp token minted at the start of the job -- so
      # mint a fresh one for everything from here on (create-pull-request
      # uses its own `token` input for the push too, overriding the
      # credentials Checkout yacp persisted). Same condition as either
      # Create Pull Request step below could run under.
      - name: Refresh yacp token
        id: app-token-pr
        if: always() && (steps.bump.outcome == 'success' || steps.detect.outcome == 'success') && !inputs.validate_only
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DORGANN_APP_ID }}
          private-key: ${{ secrets.DORGANN_APP_PRIVATE_KEY }}
          owner: yacp-dev
          repositories: ports

      # Placed after the artifact upload so a problem here (still
      # unvalidated as of Step 2 -- first real use of the yacp token) can't
      # cost the dist artifact too.
      #
      # add-paths defaults to `git add -A` over the whole checkout if
      # omitted, which would re-add the build tree/cache junk Show diff
      # deliberately excludes above -- pass the identical pathspec here
      # so this step's own staging (it doesn't reuse Show diff's) stays
      # consistent with it.
      #
      # branch is deterministic (package+version, not run id), so
      # re-running this workflow for the same package/version updates
      # the existing PR/branch instead of piling up duplicates --
      # create-pull-request's own designed behavior for this case.
      #
      # base: master is set explicitly rather than relying on the default
      # (whatever ref Checkout yacp checked out) purely as cheap, always-
      # correct documentation -- Checkout yacp only ever checks out
      # master now (see its own comment for why an earlier attempt at
      # checking out the branch directly here broke this action's base-
      # branch reconciliation), so this is redundant in practice, not
      # load-bearing.
      - name: Create Pull Request
        id: create-pr
        if: ${{ !inputs.validate_only }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token-pr.outputs.token }}
          path: yacp
          # Attribute the commit to the App's bot too, not just the PR
          # -- see Resolve bot identity above.
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          base: master
          add-paths: |
            ${{ inputs.package }}
            :(exclude)${{ inputs.package }}/*.x86_64/**
            :(exclude)${{ inputs.package }}/*.x86_64.yml
            :(exclude)${{ inputs.package }}/*.tar.*
          branch: dorgann/${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}
          delete-branch: true
          # "<PN>-<PV>", no colon or verb, matches yacp's own existing
          # commit message convention (checked against its git history).
          commit-message: "${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}"
          title: "${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}"
          # Leaving `draft` unset (defaults to false) does NOT un-draft an
          # existing draft PR on update, contrary to what
          # peter-evans/create-pull-request's own docs implied -- confirmed
          # by a real branch-rebuild success (title/body updated correctly,
          # but isDraft stayed true). Mark Pull Request ready for review
          # below handles it explicitly instead.
          #
          # The dorgann-meta HTML comment mirrors the machine-parseable
          # metadata convention doc/spec.md 4.5 already uses for failure
          # Issues -- an HTML comment survives copy/paste and markdown
          # reformatting better than expecting something to scrape a
          # human-facing code block. artifact-id is actions/upload-
          # artifact's own step output (v4+), not something computed here.
          body: |
            Version `${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}`, built and validated by [dorgann](https://github.com/yacp-dev/dist).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            <!-- dorgann-meta: {"artifact_id":"${{ steps.upload.outputs.artifact-id }}"} -->

            To publish this build to gh-pages:
            ```
            gh workflow run publish.yml -f artifact_id=${{ steps.upload.outputs.artifact-id }} --repo ${{ github.repository }}
            ```

      # Only matters in branch-rebuild mode (doc/spec.md 4.6): a fresh-
      # bump-mode PR is never a draft in the first place (Create draft
      # Pull Request below only runs on the failure path), so this is a
      # harmless no-op for that case. `gh pr ready` on an already-ready PR
      # is idempotent. Skipped for validate_only along with Create Pull
      # Request above -- steps.create-pr.outputs.pull-request-number is
      # empty when that step didn't run, and `gh pr ready` with an empty
      # argument would just error.
      - name: Mark Pull Request ready for review
        if: ${{ !inputs.validate_only }}
        env:
          GH_TOKEN: ${{ steps.app-token-pr.outputs.token }}
        run: gh pr ready ${{ steps.create-pr.outputs.pull-request-number }} --repo yacp-dev/ports

      # Branch-rebuild mode's entry point (doc/spec.md 4.6). Mirrors
      # Create Pull Request above (same deterministic branch name, so
      # re-running this workflow for the same package/version updates the
      # same branch/PR either action created), but only runs on the
      # failure path, and only if there's actually something to push --
      # Bump version/Detect existing cygport succeeding means the package
      # directory has at least a rename to show, even though the build
      # itself failed later. This gives a human a concrete branch to pull,
      # fix by hand (add a missing BUILD_REQUIRES, rename PKG_NAMES for an
      # ABI bump, ...), and push straight back to -- at which point
      # re-running this workflow with `branch` set to this same name picks
      # the fix up (skipping the bump, since it's already done) and
      # re-validates it for real.
      #
      # validate_only is excluded explicitly here too (matching Create
      # Pull Request above) rather than relying on there being no diff to
      # push -- confirmed by a real run (socket++ 1.12.13) that
      # peter-evans/create-pull-request happens to no-op gracefully
      # ("Branch ... is not ahead of base 'master' and will not be
      # created") when validate_only genuinely has nothing to commit, but
      # that's an implicit consequence of there being no bump, not a
      # guarantee -- explicit is safer than depending on it.
      - name: Create draft Pull Request (on failure)
        id: create-draft-pr
        if: failure() && (steps.bump.outcome == 'success' || steps.detect.outcome == 'success') && !inputs.validate_only
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token-pr.outputs.token }}
          path: yacp
          # See Create Pull Request above.
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          # See Create Pull Request above -- redundant in practice, kept
          # as documentation.
          base: master
          add-paths: |
            ${{ inputs.package }}
            :(exclude)${{ inputs.package }}/*.x86_64/**
            :(exclude)${{ inputs.package }}/*.x86_64.yml
            :(exclude)${{ inputs.package }}/*.tar.*
          branch: dorgann/${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}
          delete-branch: true
          draft: true
          commit-message: "${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}"
          # Same "<PN>-<PV>" title as Create Pull Request above -- whether
          # it built is what draft status and the body are for, not the
          # title. Keeping it identical also means the eventual successful
          # re-run doesn't need to change the title at all, only the draft
          # status (Mark Pull Request ready for review) and body.
          title: "${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}"
          body: |
            Version `${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}`, but the build failed -- see the failure Issue and the run log below for what's wrong.

            Push a fix directly onto this branch (`dorgann/${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}`), then re-run the build against it:
            ```
            gh workflow run build-package.yml -f package=${{ inputs.package }} -f branch=dorgann/${{ inputs.package }}-${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }} --repo ${{ github.repository }}
            ```

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # No `if:` here -- a step without one only runs if every earlier step
      # in the job succeeded (doc/spec.md 4.4: "If there's an open failure
      # Issue for the same package, it is closed."). On the failure path
      # this is simply skipped, and File failure Issue below (which does
      # have its own `if: failure()`) runs instead.
      - name: Close failure Issue
        id: close-issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -- scripts/close_failure_issue.sh --repo ${{ github.repository }} --package "${{ inputs.package }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Last step with actual work to do, and the only one with
      # `if: failure()` -- doc/spec.md 4.5. Runs regardless of which
      # earlier step failed (bump, cygport build, xezat, Create Pull
      # Request, ...); the Issue just links back to this run rather than
      # embedding a log excerpt (see doc/spec.md 4.5 for why), so which
      # step it was is one click away rather than baked in here.
      - name: File failure Issue
        id: file-issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -- scripts/report_build_failure.sh --repo ${{ github.repository }} --package "${{ inputs.package }}" --version "${{ steps.bump.outputs.version }}${{ steps.detect.outputs.version }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --diagnostic-file "${{ steps.diagnose-patch.outputs.diagnostic_file }}"

      # Genuinely last step, if: always() so it runs whichever of the
      # above actually fired. GitHub renders $GITHUB_STEP_SUMMARY as
      # Markdown right at the top of the run page, unlike a plain log
      # line, which is only visible after opening this specific job and
      # scrolling to the right step.
      #
      # Each link is a concatenation of the (at most one non-empty) PR/
      # Issue step outputs above, same pattern as the version/cygport_file
      # outputs earlier in this file -- whichever step actually ran is
      # the one whose output survives.
      - name: Write job summary
        if: always()
        run: bash -- scripts/write_job_summary.sh --package "${{ inputs.package }}" --pr-url "${{ steps.create-pr.outputs.pull-request-url }}${{ steps.create-draft-pr.outputs.pull-request-url }}" --issue-url "${{ steps.file-issue.outputs.issue_url }}${{ steps.close-issue.outputs.issue_url }}" --artifact-id "${{ steps.upload.outputs.artifact-id }}"
